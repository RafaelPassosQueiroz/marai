[project]
name = "marai-worker"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.136.1,<1",
    "sqlalchemy==2.0.48",
    "pg8000>=1.31.6,<2",
    "pydantic==2.12.5",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "argon2-cffi==23.1.0",
    "argon2-cffi-bindings==25.1.0",
    "cffi==2.0.0",
    "cryptography==47.0.0",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "mutagen>=1.47,<2",
    "authlib>=1.4,<2",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
